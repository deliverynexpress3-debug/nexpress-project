name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code from GitHub onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install PHP and Composer on the runner using official Ubuntu packages
      - name: Setup PHP and Composer
        run: |
          sudo apt update
          sudo apt install -y php php-cli php-fpm php-mysql php-mbstring php-xml php-bcmath php-tokenizer php-curl php-zip php-gd composer
          php -v
          composer -V

      # Step 3: Install Composer dependencies
      # --no-dev = skip dev-only packages (faster, smaller)
      # --optimize-autoloader = faster class loading in production
      # --no-interaction = no prompts (needed in CI)
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # Step 4: Deploy to VPS via SCP + SSH
      - name: Deploy to VPS
        run: |
          # Write the SSH private key
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key

          # Sync project files to VPS (exclude .git, node_modules, vendor - these are rebuilt on VPS)
          # Keep runtime storage on the VPS so --delete does not wipe sessions/uploads/logs
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/logs/' \
            --exclude='storage/app/public/' \
            --exclude='public/storage' \
            --exclude='bootstrap/cache/*.php' \
            -e "ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/html/nexpress/

          # SSH into VPS and run deployment commands
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'REMOTE_EOF'
            cd /var/www/html/nexpress

            # Ensure Laravel writable directories exist (rsync may not recreate empty runtime dirs)
            mkdir -p storage/framework/sessions \
                     storage/framework/views \
                     storage/framework/cache/data \
                     storage/logs \
                     storage/app/public \
                     bootstrap/cache

            # Install PHP dependencies on the VPS
            composer install --no-dev --optimize-autoloader --no-interaction

            # Make sure the .env file exists (it's not in Git)
            if [ ! -f .env ]; then
              echo ".env file not found! Please create it on the VPS."
              exit 1
            fi

            # Run database migrations in production mode
            php artisan migrate --force

            # Clear config cache so dynamic .env variables load properly, rebuild route and view caches
            php artisan config:clear
            php artisan route:cache
            php artisan view:cache

            # Ensure public storage symlink exists
            php artisan storage:link --force

            # Fix permissions so Apache (www-data) can read/write storage
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Disable PCRE JIT (VPS security policies often block JIT executable memory)
            for ini in /etc/php/*/apache2/php.ini /etc/php/*/fpm/php.ini /etc/php/*/cli/php.ini; do
              if [ -f "$ini" ]; then
                if grep -qE '^\s*;?\s*pcre\.jit\s*=' "$ini"; then
                  sudo sed -i 's/^\s*;\?\s*pcre\.jit\s*=.*/pcre.jit=0/' "$ini"
                else
                  echo 'pcre.jit=0' | sudo tee -a "$ini" > /dev/null
                fi
              fi
            done

            # Reload PHP-FPM (if present) and Apache
            for svc in $(systemctl list-units --type=service --state=running --no-legend 'php*-fpm*' 2>/dev/null | awk '{print $1}'); do
              sudo systemctl reload "$svc" || true
            done
            sudo systemctl reload apache2
          REMOTE_EOF
